services:
  mysql:
    image: mysql:8.4
    container_name: sc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sala-capitular

  eureka-server:
    build: ./eurekaserver
    container_name: sc-eureka
    ports:
      - "8761:8761"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sala-capitular

  rol:
    build: ./Rol/Rol
    container_name: sc-rol
    ports:
     - "8081:8081"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/db_rol
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - sala-capitular

  catalogo:
    build: ./Catalogo/Catalogo
    container_name: sc-catalogo
    ports:
     - "8083:8083"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/db_catalogo
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - sala-capitular

  estado:
    build: ./Estado/Estado
    container_name: sc-estado
    ports:
     - "8084:8084"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/db_estado
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - sala-capitular

  user:
    build: ./User/User
    container_name: sc-user
    ports:
     - "8082:8082"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/db_user
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      MS_ROL_URL: http://rol:8081
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      rol:
        condition: service_started
    networks:
      - sala-capitular

  libro:
    build: ./Libro/Libro
    container_name: sc-libro
    ports:
     - "8085:8085"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/db_libro
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      MS_CATALOGO_URL: http://catalogo:8083
      MS_ESTADO_URL: http://estado:8084
      MS_USER_URL: http://user:8082
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      catalogo:
        condition: service_started
      estado:
        condition: service_started
      user:
        condition: service_started
    networks:
      - sala-capitular

  estante:
    build: ./Estante/Estante
    container_name: sc-estante
    ports:
     - "8086:8086"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/db_estante
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      MS_LIBRO_URL: http://libro:8085
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      libro:
        condition: service_started
    networks:
      - sala-capitular

  historial:
    build: ./Historial/Historial
    container_name: sc-historial
    ports:
     - "8087:8087"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/db_historial
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      MS_LIBRO_URL: http://libro:8085
      MS_USER_URL: http://user:8082
      MS_ESTADO_URL: http://estado:8084
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      libro:
        condition: service_started
      user:
        condition: service_started
      estado:
        condition: service_started
    networks:
      - sala-capitular

  multas:
    build: ./Multas/Multas
    container_name: sc-multas
    ports:
     - "8088:8088"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/db_multas
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      MS_USER_URL: http://user:8082
      MS_HISTORIAL_URL: http://historial:8087
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      user:
        condition: service_started
      historial:
        condition: service_started
    networks:
      - sala-capitular

  detalle:
    build: ./Detalle/Detalle
    container_name: sc-detalle
    ports:
     - "8090:8090"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/db_detalle
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      MS_HISTORIAL_URL: http://historial:8087
      MS_LIBRO_URL: http://libro:8085
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      historial:
        condition: service_started
      libro:
        condition: service_started
    networks:
      - sala-capitular

  resena:
    build: ./ReseñaLibro/ReseñaLibro
    container_name: sc-resena
    ports:
     - "8091:8091"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/db_resena_libro
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      MS_LIBRO_URL: http://libro:8085
      MS_USER_URL: http://user:8082
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      libro:
        condition: service_started
      user:
        condition: service_started
    networks:
      - sala-capitular

  reserva:
    build: ./ReservaLibro/ReservaLibro
    container_name: sc-reserva
    environment:
      DB_URL: jdbc:mysql://mysql:3306/db_reserva_libro
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      MS_LIBRO_URL: http://libro:8085
      MS_USER_URL: http://user:8082
      MS_MULTAS_URL: http://multas:8088
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      libro:
        condition: service_started
      user:
        condition: service_started
      multas:
        condition: service_started
    networks:
      - sala-capitular

  api-gateway:
    build: ./api-gateway
    container_name: sc-gateway
    ports:
      - "8080:8080"
    environment:
      MS_ROL_URL: http://rol:8081
      MS_USER_URL: http://user:8082
      MS_CATALOGO_URL: http://catalogo:8083
      MS_ESTADO_URL: http://estado:8084
      MS_LIBRO_URL: http://libro:8085
      MS_ESTANTE_URL: http://estante:8086
      MS_HISTORIAL_URL: http://historial:8087
      MS_MULTAS_URL: http://multas:8088
      MS_RESERVA_URL: http://reserva:8089
      MS_DETALLE_URL: http://detalle:8090
      MS_RESENA_URL: http://resena:8091
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_started
      rol:
        condition: service_started
      user:
        condition: service_started
      catalogo:
        condition: service_started
      estado:
        condition: service_started
      libro:
        condition: service_started
      estante:
        condition: service_started
      historial:
        condition: service_started
      multas:
        condition: service_started
      reserva:
        condition: service_started
      detalle:
        condition: service_started
      resena:
        condition: service_started
    networks:
      - sala-capitular

networks:
  sala-capitular:
    driver: bridge

volumes:
  mysql-data: