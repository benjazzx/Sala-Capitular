server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: rol
            uri: ${MS_ROL_URL:http://localhost:8081}
            predicates:
              - Path=/api/roles/**
          - id: user
            uri: ${MS_USER_URL:http://localhost:8082}
            predicates:
              - Path=/api/users/**
          - id: catalogo
            uri: ${MS_CATALOGO_URL:http://localhost:8083}
            predicates:
              - Path=/api/catalogos/**
          - id: estado
            uri: ${MS_ESTADO_URL:http://localhost:8084}
            predicates:
              - Path=/api/estados/**
          - id: libro
            uri: ${MS_LIBRO_URL:http://localhost:8085}
            predicates:
              - Path=/api/libros/**
          - id: estante
            uri: ${MS_ESTANTE_URL:http://localhost:8086}
            predicates:
              - Path=/api/estantes/**
          - id: historial
            uri: ${MS_HISTORIAL_URL:http://localhost:8087}
            predicates:
              - Path=/api/historiales/**
          - id: multas
            uri: ${MS_MULTAS_URL:http://localhost:8088}
            predicates:
              - Path=/api/multas/**
          - id: reserva
            uri: ${MS_RESERVA_URL:http://localhost:8089}
            predicates:
              - Path=/api/reservas/**
          - id: detalle
            uri: ${MS_DETALLE_URL:http://localhost:8090}
            predicates:
              - Path=/api/detalles/**
          - id: resena
            uri: ${MS_RESENA_URL:http://localhost:8091}
            predicates:
              - Path=/api/resenas/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
